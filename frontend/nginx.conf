map $http_x_real_ip $cgc_client_ip {
  default $http_x_real_ip;
  "" $remote_addr;
}

limit_req_zone $cgc_client_ip zone=product_code_ai:10m rate=5r/m;
limit_conn_zone $cgc_client_ip zone=product_code_ai_connections:10m;

server {
  listen 80;
  server_name _;

  # The API accepts up to three product photos of 10 MB each. Nginx defaults
  # to 1 MB, which rejects ordinary phone photos before FastAPI sees them.
  client_max_body_size 32m;

  root /usr/share/nginx/html;
  index index.html;

  location = /api/v1/product-codes/suggest {
    limit_req zone=product_code_ai burst=4 nodelay;
    limit_req_status 429;
    limit_conn product_code_ai_connections 2;
    limit_conn_status 429;

    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $cgc_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $cgc_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
