server {
  listen 80;
  server_name _;

  # The API accepts up to three product photos of 10 MB each. Nginx defaults
  # to 1 MB, which rejects ordinary phone photos before FastAPI sees them.
  client_max_body_size 32m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
