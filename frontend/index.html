<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Митне оформлення вантажів виконують власні фахівці ClearGateCustoms. Організовуємо супутню логістику — доставку через порти Гданська й Констанци до складу клієнта в Україні."
    />
    <meta name="theme-color" content="#16221e" />
    <title>ClearGateCustoms — митне оформлення вантажів з Китаю та Європи</title>
    <script>
      if (window.location.hash.includes('figmacapture')) {
        document.documentElement.classList.add('figma-capture');
      }
    </script>
    <style>
      .figma-capture [data-reveal] {
        opacity: 1 !important;
        transform: none !important;
      }

      .figma-capture * {
        animation: none !important;
        transition: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
