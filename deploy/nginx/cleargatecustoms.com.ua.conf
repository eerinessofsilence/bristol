limit_req_zone $binary_remote_addr zone=product_code_ai:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=product_code_ai_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name cleargatecustoms.com.ua www.cleargatecustoms.com.ua;

    # Match the application limit: up to three product photos of 10 MB each.
    client_max_body_size 32m;

    location = /api/v1/product-codes/suggest {
        limit_req zone=product_code_ai burst=4 nodelay;
        limit_req_status 429;
        limit_conn product_code_ai_connections 2;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
