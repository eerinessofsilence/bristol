services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cleargatecustoms
      POSTGRES_USER: cleargatecustoms
      POSTGRES_PASSWORD: cleargatecustoms
    ports:
      - "5432:5432"
    volumes:
      - cleargatecustoms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleargatecustoms -d cleargatecustoms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cleargatecustoms:cleargatecustoms@db:5432/cleargatecustoms
      CORS_ORIGINS: http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  cleargatecustoms_postgres_data:
