services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portway
      POSTGRES_USER: portway
      POSTGRES_PASSWORD: portway
    ports:
      - "5432:5432"
    volumes:
      - portway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portway -d portway"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://portway:portway@db:5432/portway
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  portway_postgres_data:

